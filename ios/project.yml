# El proyecto de Xcode no se guarda: sale de este fichero con XcodeGen
# (`brew install xcodegen && cd ios && xcodegen generate`). Asi no hay un
# .pbxproj que se pise en cada rama; las carpetas de Contacto/ son las fuentes.
name: Contacto

options:
  bundleIdPrefix: com.cmatuteortega
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    # CI los pisa: la version viene de la etiqueta de git y el build del numero de ejecucion.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Contacto:
    type: application
    platform: iOS
    sources:
      - path: Contacto
        excludes:
          - Info.plist
    info:
      path: Contacto/Info.plist
      properties:
        CFBundleDisplayName: Contacto
        CFBundleLocalizations: [en, es, fr, de, ru]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.lifestyle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cmatuteortega.contacto
        PRODUCT_NAME: Contacto
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic

  ContactoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ContactoTests
    dependencies:
      - target: Contacto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cmatuteortega.contacto.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Contacto:
    build:
      targets:
        Contacto: all
        ContactoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ContactoTests
    archive:
      config: Release
