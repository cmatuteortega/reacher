name: Humo

# Prueba de humo de la version publicada: la app minimizada con R8 (variante
# benchmarkRelease, igual que la de Play pero firmada con la clave de
# depuracion) en un emulador, con el recorrido principal (bienvenida, las tres
# vistas, ajustes, cerrar y volver a abrir). Lo que R8 rompe no lo ven las
# pruebas de Robolectric, que corren sin minimizar. No subir a Play una
# version cuyo Humo este en rojo.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  humo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Android 14 y Android 16 (edge-to-edge obligatorio; las capturas de cada
    # pantalla van en el informe para revisar los bordes).
    strategy:
      fail-fast: false
      matrix:
        dispositivo: [pixel6Api34, pixel6Api36]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Recorrido con la version minimizada
        run: >
          ./gradlew :baselineprofile:${{ matrix.dispositivo }}BenchmarkReleaseAndroidTest --stacktrace
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.experimental.testOptions.managedDevices.setupTimeoutMinutes=20
          -Pandroid.experimental.androidTest.numManagedDeviceShards=1
          -Pandroid.testInstrumentationRunnerArguments.class=com.example.recuerdallamar.rendimiento.Humo
          -Pandroid.testInstrumentationRunnerArguments.humo=true

      - name: Informe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: humo-${{ matrix.dispositivo }}
          path: |
            baselineprofile/build/reports/androidTests/
            baselineprofile/build/outputs/androidTest-results/
            baselineprofile/build/outputs/managed_device_android_test_additional_output/
          if-no-files-found: ignore
