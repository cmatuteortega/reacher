name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # versionCode sube con cada ejecucion; versionName es la ultima etiqueta
      # de git (v1.2.0 -> 1.2.0) mas lo que haya encima, o el commit si no hay.
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Toda la historia y las etiquetas, para git describe.
          fetch-depth: 0

      - name: Version
        run: echo "VERSION_NAME=$(git describe --tags --always | sed 's/^v//')" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Lo primero: si una prueba o lint falla, no se compila ni se sube nada.
      # Las pruebas corren en la JVM con Robolectric (base de datos,
      # migraciones, workers y pantallas): no hace falta emulador.
      - name: Pruebas
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug

      - name: Informes de pruebas y lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Compilar APK de depuracion
        run: ./gradlew assembleDebug --stacktrace -Pcontacto.versionCode=$VERSION_CODE -Pcontacto.versionName=$VERSION_NAME

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      # Solo con los secretos de la firma (no llegan a los PR desde forks).
      - name: Preparar firma
        id: firma
        env:
          KEYSTORE_BASE64: ${{ secrets.CONTACTO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/subida.jks"
            echo "CONTACTO_KEYSTORE=$RUNNER_TEMP/subida.jks" >> "$GITHUB_ENV"
            echo "hay=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Sin CONTACTO_KEYSTORE_BASE64: no se compila la version publicada."
          fi

      # Las claves de Sentry y PostHog solo van en la version publicada: el APK
      # de depuracion no manda nada. Con SENTRY_AUTH_TOKEN, el plugin de Sentry
      # sube el mapping de R8 para que las trazas lleguen legibles.
      - name: Compilar AAB de publicacion
        if: steps.firma.outputs.hay == 'true'
        env:
          CONTACTO_KEYSTORE_PASSWORD: ${{ secrets.CONTACTO_KEYSTORE_PASSWORD }}
          CONTACTO_KEY_ALIAS: ${{ secrets.CONTACTO_KEY_ALIAS }}
          CONTACTO_KEY_PASSWORD: ${{ secrets.CONTACTO_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: >
          ./gradlew bundleRelease --stacktrace
          -Pcontacto.versionCode=$VERSION_CODE -Pcontacto.versionName=$VERSION_NAME
          -Pcontacto.sentryDsn="$SENTRY_DSN" -Pcontacto.posthogKey="$POSTHOG_API_KEY"

      # El mapping.txt de R8 va con el AAB: Play Console lo pide para leer las trazas.
      - name: Subir AAB
        if: steps.firma.outputs.hay == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ env.VERSION_NAME }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt

