name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # versionCode sube con cada ejecucion; versionName es la ultima etiqueta
      # de git (v1.2.0 -> 1.2.0) mas lo que haya encima, o el commit si no hay.
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Toda la historia y las etiquetas, para git describe.
          fetch-depth: 0

      - name: Version
        run: echo "VERSION_NAME=$(git describe --tags --always | sed 's/^v//')" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # Lo primero: si una prueba o lint falla, no se compila ni se sube nada.
      # Las pruebas corren en la JVM con Robolectric (base de datos,
      # migraciones, workers y pantallas): no hace falta emulador.
      - name: Pruebas
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug

      # Notas de la version para Play: en cada idioma los mismos ficheros
      # (default.txt o <versionCode>.txt) y de 500 caracteres como mucho.
      - name: Notas de la version
        env:
          LC_ALL: C.UTF-8
        run: |
          cd fastlane/metadata/android
          referencia=$(ls en-US/changelogs | sort)
          fallo=0
          for idioma in */; do
            idioma=${idioma%/}
            if [ "$(ls "$idioma/changelogs" 2>/dev/null | sort)" != "$referencia" ]; then
              echo "::error::$idioma/changelogs no tiene las mismas notas que en-US"
              fallo=1
            fi
            for f in "$idioma"/changelogs/*.txt; do
              [ -e "$f" ] || continue
              n=$(wc -m < "$f")
              if [ "$n" -gt 500 ]; then
                echo "::error file=fastlane/metadata/android/$f::$n caracteres (Play admite 500)"
                fallo=1
              fi
            done
          done
          exit $fallo

      - name: Informes de pruebas y lint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informes
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Compilar APK de depuracion
        run: ./gradlew assembleDebug --stacktrace -Pcontacto.versionCode=$VERSION_CODE -Pcontacto.versionName=$VERSION_NAME

      - name: Subir APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      # Solo con los secretos de la firma (no llegan a los PR desde forks).
      - name: Preparar firma
        id: firma
        env:
          KEYSTORE_BASE64: ${{ secrets.CONTACTO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/subida.jks"
            echo "CONTACTO_KEYSTORE=$RUNNER_TEMP/subida.jks" >> "$GITHUB_ENV"
            echo "hay=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Sin CONTACTO_KEYSTORE_BASE64: no se compila la version publicada."
          fi

      # Con Sentry pero sin lo necesario para subir el mapping de R8, las trazas
      # de la version publicada llegan ofuscadas y no se ve donde falla. Aviso
      # en cualquier rama; en una etiqueta v* (lo que va a Play), fallo.
      - name: Comprobar mapping de Sentry
        if: steps.firma.outputs.hay == 'true'
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          [ -n "$SENTRY_DSN" ] || exit 0
          faltan=""
          [ -n "$SENTRY_AUTH_TOKEN" ] || faltan="$faltan SENTRY_AUTH_TOKEN (secret)"
          [ -n "$SENTRY_ORG" ] || faltan="$faltan SENTRY_ORG (variable)"
          [ -n "$SENTRY_PROJECT" ] || faltan="$faltan SENTRY_PROJECT (variable)"
          [ -z "$faltan" ] && exit 0
          mensaje="Hay SENTRY_DSN pero faltan:$faltan. El mapping de R8 no se sube y las trazas llegan ofuscadas (ver PUBLICAR.md)."
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::$mensaje"
            exit 1
          fi
          echo "::warning::$mensaje"

      # Las claves de Sentry y PostHog solo van en la version publicada: el APK
      # de depuracion no manda nada. Con SENTRY_AUTH_TOKEN, el plugin de Sentry
      # sube el mapping de R8 para que las trazas lleguen legibles.
      - name: Compilar AAB de publicacion
        if: steps.firma.outputs.hay == 'true'
        env:
          CONTACTO_KEYSTORE_PASSWORD: ${{ secrets.CONTACTO_KEYSTORE_PASSWORD }}
          CONTACTO_KEY_ALIAS: ${{ secrets.CONTACTO_KEY_ALIAS }}
          CONTACTO_KEY_PASSWORD: ${{ secrets.CONTACTO_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: >
          ./gradlew bundleRelease --stacktrace
          -Pcontacto.versionCode=$VERSION_CODE -Pcontacto.versionName=$VERSION_NAME
          -Pcontacto.sentryDsn="$SENTRY_DSN" -Pcontacto.posthogKey="$POSTHOG_API_KEY"

      # El mapping.txt de R8 va con el AAB: Play Console lo pide para leer las trazas.
      - name: Subir AAB
        if: steps.firma.outputs.hay == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: app-release-${{ env.VERSION_NAME }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt

