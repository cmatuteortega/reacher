name: Rendimiento

# A mano (pestana Actions > Rendimiento > Run workflow, eligiendo la rama):
# genera el perfil de referencia de la app y mide el arranque en un emulador.
# Tarda y necesita KVM, asi que no va en cada push. El perfil se sube solo
# con un commit a la rama elegida (app/src/release/generated/baselineProfiles/)
# y sale tambien como artefacto. Conviene repetirlo cuando cambien las
# pantallas principales.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rendimiento:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Emulador sin pantalla y con tiempo para arrancar en el runner.
      GRADLE_EMULADOR: >-
        -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
        -Pandroid.experimental.testOptions.managedDevices.setupTimeoutMinutes=20
        -Pandroid.experimental.androidTest.numManagedDeviceShards=1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generar perfil de referencia
        run: ./gradlew :app:generateReleaseBaselineProfile $GRADLE_EMULADOR --stacktrace

      - name: Subir perfil
        uses: actions/upload-artifact@v4
        with:
          name: perfil-de-referencia
          path: app/src/release/generated/baselineProfiles/

      - name: Guardar perfil en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898296+github-actions[bot]@users.noreply.github.com"
          git add app/src/release/generated/baselineProfiles/
          if git diff --cached --quiet; then
            echo "El perfil no ha cambiado."
          else
            git commit -m "Perfil de referencia generado en CI"
            # La rama puede haber avanzado mientras se generaba.
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      # En un emulador las mediciones no valen como cifras absolutas (de ahi
      # suppressErrors), pero la diferencia con y sin perfil si se ve.
      - name: Medir arranque
        run: >
          ./gradlew :baselineprofile:pixel6Api34BenchmarkReleaseAndroidTest $GRADLE_EMULADOR --stacktrace
          -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR

      - name: Subir mediciones
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediciones
          path: baselineprofile/build/outputs/
          if-no-files-found: ignore
