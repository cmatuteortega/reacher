name: Rendimiento

# A mano (pestana Actions > Rendimiento > Run workflow): genera el perfil de
# referencia de la app y mide el arranque en un emulador. Tarda y necesita
# KVM, asi que no va en cada push. El perfil sale como artefacto: se copia a
# app/src/release/generated/baselineProfiles/ y se sube con un commit.
on:
  workflow_dispatch:

jobs:
  rendimiento:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Emulador sin pantalla y con tiempo para arrancar en el runner.
      GRADLE_EMULADOR: >-
        -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
        -Pandroid.experimental.testOptions.managedDevices.setupTimeoutMinutes=20
        -Pandroid.experimental.androidTest.numManagedDeviceShards=1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generar perfil de referencia
        run: ./gradlew :app:generateReleaseBaselineProfile $GRADLE_EMULADOR --stacktrace

      - name: Subir perfil
        uses: actions/upload-artifact@v4
        with:
          name: perfil-de-referencia
          path: app/src/release/generated/baselineProfiles/

      - name: Medir arranque
        run: ./gradlew :baselineprofile:pixel6Api34BenchmarkReleaseAndroidTest $GRADLE_EMULADOR --stacktrace

      - name: Subir mediciones
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediciones
          path: baselineprofile/build/outputs/
          if-no-files-found: ignore
